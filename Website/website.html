<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: aquamarine;
        }

        nav {
            background-color: rgb(123, 221, 96);
            padding: 20px;
            display: flex;
            justify-content: space-around;
            margin: 23px;
            border-radius: 34px;
            align-items: center;
        }

        nav h2 {
            padding-left: 100px;
            font-size: xx-large;
        }

        .links ul {
            display: flex;
            gap: 50px;
            list-style: none;
            justify-content: right;
            padding-left: 625px;
            position: relative;
            padding: 2px;

        }

        .links ul li a {
            text-decoration: none;
            color: black;
            font-weight: bolder;
            border: none;
            border-radius: 34px;
            padding: 8px 11px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        .links ul li a:hover {
            background-color: white;
            font-size: large;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .input input {
            width: 300px;
            background-color: gray;
            padding: 12px 0 12px 23px;
            border-radius: 34px;
            border: none;
        }
        .input{
            padding-left: 200px;
        }
        input::placeholder{
            color: whitesmoke;
        }
        input{
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <h2>Siva</h2>
            <div class="input">
                <input type="text" placeholder="Search">
            </div>
            <div class="links">
                <ul>
                    <li><a href="account.html">Login</a></li>
                    <li><a href="signup.html">SignUp</a></li>
                    <li><a href="#">About Me</a></li>
                </ul>
            </div>
        </nav>
    </header>
</body>

</html>

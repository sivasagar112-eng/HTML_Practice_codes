<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 400px;
            width: 70vw;
            border: 2px solid black;
            margin: 12px;
        }

        .box1 {
            background-color: aqua;
            position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            /* position: absolute;
            top: 0px; */
        }

        .box2 {
            background-color: black;
        }

        .box3 {
            background-color: silver;
            /* position: fixed;
            bottom: 2px;
            left: 8vw;
            height: 111px; */
        }

        .box4 {
            background-color: gold;
        }

        .parent {
            margin: 34px;
            padding: 43px;
            border: 2px solid black;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
